<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerSim · Human Play Lab</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body>
<header><div><small>HUMAN PLAY LAB</small><h1>CareerSim</h1></div><div id="timeline">准备开始</div><span id="mode"></span></header>
<nav><button id="handbook-open">入职手册</button><button id="history-open">最近选择</button><button id="shutdown">退出客户端</button></nav>
<div id="notice" role="status" aria-live="polite"></div>
<section id="start-panel" class="panel"><h2>从你的选择开始</h2><p id="start-copy">离线演示不会创建真实游戏。</p>
<label for="participant">参与者 ID / 昵称</label><input id="participant" maxlength="64" value="local" autocomplete="off">
<button id="start">开始离线演示</button></section>
<main id="game-panel" hidden>
<aside class="panel"><small>PUBLIC STATE</small><h2>当前状态</h2><dl id="stats"></dl></aside>
<section class="panel event"><small>YOUR CAREER</small><h2 id="event-title"></h2><p id="event-text"></p><p id="warning"></p>
<section id="ending" hidden><h2>对局结束</h2><pre id="result"></pre><p id="export-status"></p><button id="download" hidden>下载公共数据包</button><button id="retry-export" hidden>重试导出</button></section></section>
<aside class="panel"><small>NEXT DECISION</small><h2>行动选择</h2><div id="choices"></div></aside>
</main>
<dialog id="handbook"><h2>入职手册</h2><pre id="handbook-text"></pre><button id="handbook-close">关闭</button></dialog>
<dialog id="history"><h2>最近选择</h2><ol id="history-list"></ol><button id="history-close">关闭</button></dialog>
<footer>本地运行 · 公开观察与人工选择 · 无 Provider / MCP</footer>
</body></html>
